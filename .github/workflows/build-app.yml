# Compila Vicina: APK Android (debug installabile + release non firmato + AAB) e IPA iOS NON firmato.
# Avvio: GitHub → Actions → "Compila app" → Run workflow. Alla fine scarichi i file da "Artifacts".
name: Compila app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  NODE_VERSION: '22'
  APP_VERSION: '1.0.${{ github.run_number }}'

jobs:
  web:
    name: Interfaccia (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Dipendenze
        run: npm install --no-audit --no-fund
      - name: Chiavi Supabase (.env) dai secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          if [ -z "$VITE_SUPABASE_URL" ]; then echo "::warning::Secrets Supabase assenti: l'app sarà compilata in MODALITÀ DEMO (nessun server)."; fi
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist, retention-days: 3 }

  android:
    name: Android (APK / AAB)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: Dipendenze
        run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist }
      - name: Progetto Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json; else echo "::warning::GOOGLE_SERVICES_JSON assente: notifiche push disattivate su Android."; fi
          npm run native
          npx capacitor-assets generate --android --iconBackgroundColor '#0B0B10' --iconBackgroundColorDark '#0B0B10' --splashBackgroundColor '#0B0B10' --splashBackgroundColorDark '#0B0B10' || echo "::warning::Icone non generate, uso quelle predefinite"
          npx cap sync android
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
      - name: Compila
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Raccogli file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Vicina-$APP_VERSION-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/Vicina-$APP_VERSION-release-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/Vicina-$APP_VERSION-release-unsigned.aab
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: Vicina-android, path: out/* }

  ios:
    name: iOS (IPA non firmato)
    needs: web
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Dipendenze
        run: |
          npm install --no-audit --no-fund
          sudo gem install xcodeproj --no-document || gem install xcodeproj --no-document --user-install
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist }
      - name: Progetto iOS
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          npx cap add ios --packagemanager CocoaPods
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > ios/App/App/GoogleService-Info.plist; else echo "::warning::GOOGLE_SERVICE_INFO_PLIST assente: notifiche push disattivate su iOS."; fi
          npm run native
          ruby scripts/ios-setup.rb
          npx capacitor-assets generate --ios --iconBackgroundColor '#0B0B10' --splashBackgroundColor '#0B0B10' --splashBackgroundColorDark '#0B0B10' || echo "::warning::Icone non generate, uso quelle predefinite"
          npx cap sync ios
      - name: Compila (senza firma)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Crea IPA
        run: |
          mkdir -p out/Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" out/Payload/
          cp ios/App/App/App.entitlements out/Vicina-entitlements.plist
          cd out && zip -qry "Vicina-$APP_VERSION-unsigned.ipa" Payload && rm -rf Payload && ls -la
      - uses: actions/upload-artifact@v4
        with: { name: Vicina-ios, path: out/* }

  release:
    name: Pubblica release (solo per tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, pattern: 'Vicina-*', merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: files/* }
