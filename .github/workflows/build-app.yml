# Compila Vicina: APK Android firmato (si aggiorna sopra la versione installata) + AAB, e IPA iOS NON firmato.
# Avvio: GitHub → Actions → "Compila app" → Run workflow.
# Ogni compilazione Android viene PUBBLICATA come nuova versione (GitHub Releases) con un file version.json:
# l'app la trova da sola e si aggiorna (Android) o avvisa di aggiornare (iOS).
name: Compila app

on:
  workflow_dispatch:
    inputs:
      piattaforma:
        description: 'Cosa compilare (iOS usa minuti Mac: con repository privato finiscono presto)'
        type: choice
        options: [android, ios, entrambe]
        default: android
      versione:
        description: 'Numero di versione (es. 1.2.0). Vuoto = automatico 1.0.<numero compilazione>'
        type: string
        required: false
        default: ''
      novita:
        description: 'Novità di questa versione (le vede chi aggiorna). Facoltativo'
        type: string
        required: false
        default: ''
      pubblica:
        description: 'Pubblica come aggiornamento per tutti'
        type: boolean
        default: true
  push:
    tags: ['v*']

env:
  NODE_VERSION: '22'
  # versione scelta a mano nel modulo "Run workflow", altrimenti automatica.
  # Il codice interno (run_number) sale sempre da solo: gli aggiornamenti funzionano qualunque numero scegli.
  APP_VERSION: ${{ inputs.versione != '' && inputs.versione || format('1.0.{0}', github.run_number) }}

jobs:
  web:
    name: Interfaccia (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Controlla il numero di versione
        run: |
          V="$APP_VERSION"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Versione «$V» non valida: usa solo numeri e punti, per esempio 1.2.0 oppure 2.0"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "::error::La versione $V esiste già (tag v$V): scegli un numero diverso"; exit 1; fi
          echo "Versione scelta: $V"
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Dipendenze
        run: npm install --no-audit --no-fund
      - name: Controllo stile della mappa
        run: node scripts/check-map-style.mjs
      - name: Chiavi Supabase (.env) dai secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          # versione e indirizzo da cui l'app controlla gli aggiornamenti (ultima release di questo repository)
          echo "VITE_APP_VERSION=$APP_VERSION" >> .env
          echo "VITE_APP_CODE=${{ github.run_number }}" >> .env
          echo "VITE_UPDATE_URL=https://github.com/$GITHUB_REPOSITORY/releases/latest/download/version.json" >> .env
          echo "Versione: $APP_VERSION (codice ${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          if [ -z "$VITE_SUPABASE_URL" ]; then echo "::warning::Secrets Supabase assenti: l'app sarà compilata in MODALITÀ DEMO (nessun server)."; fi
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist, retention-days: 3 }

  android:
    name: Android (APK / AAB)
    needs: web
    if: github.event_name != 'workflow_dispatch' || inputs.piattaforma != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Dipendenze
        run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist }
      - name: Progetto Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npx cap add android
          # l'Android SDK è già installato sui server di GitHub: lo indichiamo a Gradle
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"; echo "Android SDK: $SDK"
          echo "sdk.dir=$SDK" > android/local.properties
          (yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1) || true
          # GOOGLE_SERVICES_JSON: va bene sia il contenuto del file così com'è, sia in base64
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            F=android/app/google-services.json
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '^[[:space:]]*{'; then printf '%s' "$GOOGLE_SERVICES_JSON" > $F
            else printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d ' \r\n' | base64 -d > $F 2>/dev/null || true; fi
            if node -e "const j=JSON.parse(require('fs').readFileSync('$F','utf8')); if(!j.project_info) throw 0" 2>/dev/null; then echo "google-services.json OK"
            else echo "::warning::GOOGLE_SERVICES_JSON non valido (né JSON né base64 corretto): compilo senza notifiche push"; rm -f $F; fi
          else echo "::warning::GOOGLE_SERVICES_JSON assente: notifiche push disattivate su Android."; fi
          npm run native
          npx capacitor-assets generate --android --iconBackgroundColor '#0B0B10' --iconBackgroundColorDark '#0B0B10' --splashBackgroundColor '#0B0B10' --splashBackgroundColorDark '#0B0B10' || echo "::warning::Icone non generate, uso quelle predefinite"
          npx cap sync android
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
      - name: Compila
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Raccogli file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Vicina-$APP_VERSION-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/Vicina-$APP_VERSION-release-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/Vicina-$APP_VERSION-release-unsigned.aab
      - name: Firma APK (sempre con la stessa chiave → gli aggiornamenti si installano sopra)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::Manca la chiave di firma (secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD): niente aggiornamenti automatici. Vedi README → Aggiornamenti automatici."
            exit 0
          fi
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/vicina.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          KP=KS_PASS; [ -n "$KEY_PASS" ] && KP=KEY_PASS   # se la chiave non ha una password sua, usa quella del keystore
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/vicina.jks" --ks-pass env:KS_PASS --ks-key-alias "${KEY_ALIAS:-vicina}" \
            --key-pass "env:$KP" --out "out/Vicina-$APP_VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/Vicina-$APP_VERSION.apk" | head -3
          rm -f "$RUNNER_TEMP/vicina.jks"
          echo "APK firmato: Vicina-$APP_VERSION.apk" >> $GITHUB_STEP_SUMMARY
      - name: Elenco file
        run: ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: Vicina-android, path: out/* }

  ios:
    name: iOS (IPA non firmato)
    needs: web
    if: github.event_name != 'workflow_dispatch' || inputs.piattaforma != 'android'
    runs-on: macos-26   # macOS 26 con Xcode 26: serve per il Liquid Glass (prima era macos-15)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Xcode 26 o successivo (serve per il Liquid Glass di iOS 26+)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode-2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; echo "Uso $X"; echo "### Xcode: $X (Liquid Glass attivo)" >> $GITHUB_STEP_SUMMARY
          else echo "::warning::Xcode 26 non trovato su questo server: l'app si compila lo stesso, ma senza Liquid Glass."; echo "### ⚠️ Xcode 26 non trovato: niente Liquid Glass" >> $GITHUB_STEP_SUMMARY; ls -d /Applications/Xcode* || true; fi
          xcodebuild -version
      - name: Dipendenze
        run: |
          npm install --no-audit --no-fund
          echo "Xcode: $(xcodebuild -version | head -1) · CocoaPods: $(pod --version) · Ruby: $(ruby -v)"
          # xcodeproj arriva insieme a CocoaPods; se manca lo installiamo nella stessa Ruby
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj --no-document --user-install || true
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist }
      - name: Progetto iOS
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          echo "::group::cap add ios"
          npx cap add ios
          echo "::endgroup::"
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            F=ios/App/App/GoogleService-Info.plist
            if printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | grep -q '<plist\|<?xml'; then printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > $F
            else printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | tr -d ' \r\n' | base64 --decode > $F 2>/dev/null || true; fi
            plutil -lint $F || { echo "::warning::GOOGLE_SERVICE_INFO_PLIST non valido: lo ignoro (push disattivate su iOS)"; rm -f ios/App/App/GoogleService-Info.plist; }
          else echo "::warning::GOOGLE_SERVICE_INFO_PLIST assente: notifiche push disattivate su iOS."; fi
          echo "::group::permessi e push"
          npm run native
          ruby scripts/ios-setup.rb || echo "::warning::ios-setup.rb non riuscito: continuo senza entitlements push"
          echo "::endgroup::"
          npx capacitor-assets generate --ios --iconBackgroundColor '#0B0B10' --splashBackgroundColor '#0B0B10' --splashBackgroundColorDark '#0B0B10' || echo "::warning::Icone non generate, uso quelle predefinite"
          echo "::group::cap sync ios (pod install)"
          npx cap sync ios
          echo "::endgroup::"
      - name: Compila (senza firma)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Crea IPA
        run: |
          mkdir -p out/Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" out/Payload/
          cp ios/App/App/App.entitlements out/Vicina-entitlements.plist 2>/dev/null || true
          cd out && zip -qry "Vicina-$APP_VERSION-unsigned.ipa" Payload && rm -rf Payload && ls -la
      - uses: actions/upload-artifact@v4
        with: { name: Vicina-ios, path: out/* }

  release:
    name: Pubblica aggiornamento (GitHub Releases + version.json)
    needs: [android, ios]
    # parte se Android è compilato: con i tag v* sempre, con "Run workflow" se è spuntato "Pubblica"
    if: always() && needs.android.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.pubblica))
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: files, pattern: 'Vicina-*', merge-multiple: true }
      - name: Prepara file e version.json
        env:
          NOTE: ${{ inputs.novita }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          TAG="v$APP_VERSION"; [ "${GITHUB_REF_TYPE}" = "tag" ] && TAG="$GITHUB_REF_NAME"
          echo "TAG=$TAG" >> $GITHUB_ENV
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          SIGNED=$(ls files/Vicina-$APP_VERSION.apk 2>/dev/null || true)
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" files/Vicina.apk; cp "$SIGNED" files/Eduardo.apk   # link fissi per il sito
            APK="$BASE/Vicina.apk"; SHA=$(sha256sum files/Vicina.apk | cut -d' ' -f1)
          else
            echo "::warning::APK non firmato: pubblico la versione debug ma gli aggiornamenti automatici restano spenti finché non aggiungi la chiave di firma."
            cp files/*-debug.apk files/Eduardo.apk; APK=""; SHA=""
          fi
          IPA=$(cd files && ls *-unsigned.ipa 2>/dev/null | head -1 || true)
          [ -z "$NOTE" ] && NOTE="$(git log -1 --pretty=%s)"
          PAGE="${SITE_URL:-https://github.com/$GITHUB_REPOSITORY/releases/latest}"
          python3 - "$APP_VERSION" "${{ github.run_number }}" "$APK" "$SHA" "$PAGE" "${IPA:+$BASE/$IPA}" <<'PY'
          import json, sys, os, datetime
          v, code, apk, sha, page, ipa = sys.argv[1:7]
          d = {"version": v, "code": int(code), "date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
               "notes": os.environ.get("NOTE", "")[:2000], "page": page,
               "android": {"apk": apk or None, "sha256": sha or None},
               "ios": {"ipa": ipa or None, "page": page, "version": v if ipa else None, "code": int(code) if ipa else 0}}
          json.dump(d, open("files/version.json", "w"), ensure_ascii=False, indent=2)
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
          # source AltStore / SideStore (solo se c'è l'IPA)
          if [ -n "$IPA" ] && [ -f scripts/altstore-source.py ]; then
            python3 -c "from PIL import Image" 2>/dev/null || pip install -q pillow
            python3 -c "from PIL import Image; Image.open('assets/icon-only.png').convert('RGB').resize((512,512)).save('files/icon.png')" || true
            python3 scripts/altstore-source.py files "$GITHUB_REPOSITORY" "$TAG" "$APP_VERSION" "${{ github.run_number }}" || echo "::warning::source AltStore non creata"
          fi
          ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Vicina ${{ env.APP_VERSION }}
          body: ${{ inputs.novita }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: files/*
      - name: Riepilogo
        run: |
          echo "### Pubblicata Vicina $APP_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "Le app installate la troveranno entro qualche ora (o subito da Impostazioni → Aggiornamenti)." >> $GITHUB_STEP_SUMMARY
